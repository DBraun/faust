[project]
name = "faust-jax-tests"
version = "0.0.0"
description = "Dependency set for the Faust JAX/Flax backend test suites (jax-tests and impulse-tests)."
requires-python = ">=3.11"

# Runtime + test dependencies. Pinned versions live in uv.lock; regenerate with
# `uv lock --upgrade` to move to newer releases (and re-run the suites).
dependencies = [
    "jax",
    "jaxlib",
    "flax",
    "numpy",
    "scipy",
    "librosa",
    "tqdm",
    "optax",
    "pytest",
]

[project.optional-dependencies]
# Extras used only by the reinforcement-learning demo under rl_demo/.
# Not installed by the CI `uv sync` (default group only); declared so the demo is
# reproducible via `uv sync --extra rl-demo`.
rl-demo = [
    "librosax",
    "einops",
    "distrax",
    "matplotlib",
    "orbax-checkpoint",
    "clu",
    "tensorflow",   # required by clu.metric_writers, imported by reinforce_demo.py
    "tensorboard",  # clu.metric_writers.summary_writer imports tensorboard's hparams api
]

[tool.uv]
# This project is a dependency aggregator for the test suites, not an installable
# package, so don't try to build/install it during `uv sync`.
package = false
