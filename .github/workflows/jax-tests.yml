name: JAX Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [ master-dev ]
  workflow_dispatch:

jobs:
  build-faust:
    if: github.repository_owner == 'grame-cncm' || github.event_name == 'pull_request'
    # Build Faust once and share with other jobs
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential cmake pkg-config libmicrohttpd-dev

    - name: Build Faust
      run: make

    - name: Upload Faust build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: faust-build
        path: |
          build/bin/
          build/lib/
          architecture/
          libraries/
        retention-days: 1

  test-jax-impulse:
    if: github.repository_owner == 'grame-cncm' || github.event_name == 'pull_request'
    # Run JAX impulse tests
    needs: build-faust
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download Faust build artifacts
      uses: actions/download-artifact@v4
      with:
        name: faust-build

    - name: Make binaries executable
      run: |
        chmod +x build/bin/*

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd tests/impulse-tests
        pip install -r requirements.txt

    - name: Build test tools
      run: |
        cd tests/impulse-tests
        make filesCompare

    - name: Run JAX impulse tests
      run: |
        cd tests/impulse-tests
        make jax

  test-linen-impulse:
    if: github.repository_owner == 'grame-cncm' || github.event_name == 'pull_request'
    # Run Linen impulse tests
    needs: build-faust
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download Faust build artifacts
      uses: actions/download-artifact@v4
      with:
        name: faust-build

    - name: Make binaries executable
      run: |
        chmod +x build/bin/*

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd tests/impulse-tests
        pip install -r requirements.txt

    - name: Build test tools
      run: |
        cd tests/impulse-tests
        make filesCompare

    - name: Run Linen impulse tests
      run: |
        cd tests/impulse-tests
        make linen

  test-jax-minimal:
    if: github.repository_owner == 'grame-cncm' || github.event_name == 'pull_request'
    # Test JAX compilation with minimal.py architecture
    needs: build-faust
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download Faust build artifacts
      uses: actions/download-artifact@v4
      with:
        name: faust-build

    - name: Make binaries executable
      run: |
        chmod +x build/bin/*

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade jax jaxlib flax numpy tqdm librosa scipy

    - name: Run JAX minimal architecture tests
      shell: bash
      run: |
        cd tests/jax-tests
        make

    - name: Run CI validation tests
      env:
        JAX_PLATFORMS: cpu
      run: |
        cd tests/jax-tests
        echo "Running CI validation tests..."
        python test_ci_validation.py

    - name: Run random_uniform tests
      env:
        JAX_PLATFORMS: cpu
      run: |
        cd tests/jax-tests
        # Test random generation specifically
        echo "Testing random generation with JAX PRNG..."
        make test-random_test test-random_uniform test-random_stereo
    
    - name: Run delay line benchmarks
      env:
        JAX_PLATFORMS: cpu
      run: |
        cd tests/jax-tests
        echo "Running delay line optimization benchmarks..."
        # Run benchmark script - it will test various -mcd values
        python benchmark_delays.py
    
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jax-benchmark-results
        path: tests/jax-tests/delay_benchmark_results.json
        retention-days: 7
    
    - name: Display benchmark summary
      if: always()
      env:
        JAX_PLATFORMS: cpu
      run: |
        cd tests/jax-tests
        python display_benchmark_summary.py
