name: JAX Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [ master-dev ]

jobs:
  build-faust:
    # Build Faust once and share with other jobs
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential cmake pkg-config libmicrohttpd-dev

    - name: Build Faust
      run: make

    - name: Upload Faust build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: faust-build
        path: |
          build/bin/
          build/lib/
          architecture/
          libraries/
        retention-days: 1

  test-jax-impulse:
    # Run JAX impulse tests
    needs: build-faust
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download Faust build artifacts
      uses: actions/download-artifact@v4
      with:
        name: faust-build

    - name: Make binaries executable
      run: |
        chmod +x build/bin/*

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd tests/impulse-tests
        pip install -r requirements.txt
        pip install --upgrade jax jaxlib flax numpy tqdm

    - name: Build test tools
      run: |
        cd tests/impulse-tests
        make filesCompare

    - name: Run JAX impulse tests
      run: |
        cd tests/impulse-tests
        make jax

  test-jax-minimal:
    # Test JAX compilation with minimal.py architecture
    needs: build-faust
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download Faust build artifacts
      uses: actions/download-artifact@v4
      with:
        name: faust-build

    - name: Make binaries executable
      run: |
        chmod +x build/bin/*

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade jax jaxlib flax numpy tqdm librosa scipy

    - name: Run JAX minimal architecture tests
      shell: bash
      run: |
        cd tests/jax-tests
        make

